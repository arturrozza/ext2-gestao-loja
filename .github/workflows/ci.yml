name: CI

# Railway's "Wait for CI" requires the workflow to run on push.
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production] # PRs targeting these branches


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2 # version from packageManager in package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Expo doctor
        working-directory: apps/mobile
        run: bun run doctor

  test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ext2
          POSTGRES_PASSWORD: ext2
          POSTGRES_DB: ext2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # .env.test (committed) points DATABASE_URL to the ext2_test service above.
      - name: Unit + e2e
        working-directory: apps/server
        run: bun run db:migrate:test && bun run test

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    # Railway deploys this Dockerfile, so a broken image or migration fails the PR instead of the release.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ext2
          POSTGRES_PASSWORD: ext2
          POSTGRES_DB: ext2
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://ext2:ext2@localhost:5432/ext2
      PORT: "3000"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f apps/server/Dockerfile -t ext2-server .
      - name: Migrate
        run: docker run --rm --network host -e DATABASE_URL ext2-server bun src/db/migrate.ts
      - name: Health check
        run: |
          docker run -d --name server --network host -e DATABASE_URL -e PORT ext2-server
          for attempt in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs server
          exit 1
