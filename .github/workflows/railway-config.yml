name: Railway config

# Infrastructure as Code for Railway (.railway/railway.ts), based on railwayapp/config's single-workflow example:
# - plan on every PR touching .railway/ (to main or production) and comment the result on the PR;
# - apply the pinned plan when a PR into production (a release) is merged.
# Infra changes go live together with the release, like the code.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, production]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to main: Bun workspace support (package-manager: bun) isn't in a release yet (v1.2.0 only runs npm,
      # which can't install `catalog:` deps). Move back to a tag once a release includes it.
      - uses: railwayapp/config@f1f0c715716fe035319b0a716b95c6e83e0f6595
        with:
          command: plan
          package-manager: bun
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.base.ref == 'production' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      # Pinned to main: Bun workspace support (package-manager: bun) isn't in a release yet (v1.2.0 only runs npm,
      # which can't install `catalog:` deps). Move back to a tag once a release includes it.
      - uses: railwayapp/config@f1f0c715716fe035319b0a716b95c6e83e0f6595
        with:
          command: apply
          package-manager: bun
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
